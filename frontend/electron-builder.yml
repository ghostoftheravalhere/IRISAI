appId: com.irisai.desktop
productName: IRIS AI
directories:
  output: dist
files:
  - dist/**/*
  - electron/**/*
  - package.json
extraResources:
  - from: ../dist/backend
    to: backend
    filter:
      - "**/*"
  - from: ../resources
    to: resources
    filter:
      - "**/*"
win:
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: IRIS AI
  artifactName: IRIS-AI-Setup-v2.4.5.${ext}
  uninstallDisplayName: IRIS AI

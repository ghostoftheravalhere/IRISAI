appId: com.iris.ai
productName: IRIS AI
compression: store
directories:
  output: ../release
files:
  - dist/**/*
  - electron/**/*
  - package.json
extraResources:
  - from: ../dist/backend
    to: backend
    filter:
      - "**/*"
  - from: ../resources
    to: resources
    filter:
      - "**/*"
win:
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: IRIS AI
  runAfterFinish: true
  artifactName: IRIS-AI-v${version}-Setup.${ext}
  uninstallDisplayName: IRIS AI

